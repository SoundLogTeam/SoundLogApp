<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soundlog 디자인 피드백 검수</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080b19;
        color: #f7f8fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      header,
      main {
        margin: 0 auto;
        max-width: 1440px;
      }

      header {
        margin-bottom: 28px;
      }

      h1 {
        font-size: 28px;
        letter-spacing: 0;
        margin: 0 0 8px;
      }

      header p {
        color: #aeb4c7;
        line-height: 1.6;
        margin: 0;
      }

      main {
        display: grid;
        gap: 24px;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      }

      figure {
        background: #11162a;
        border: 1px solid #2c3552;
        border-radius: 8px;
        margin: 0;
        overflow: hidden;
      }

      a {
        color: inherit;
        display: block;
        position: relative;
        text-decoration: none;
      }

      img {
        display: block;
        height: auto;
        width: 100%;
      }

      .page-label {
        align-items: center;
        background: rgba(8, 11, 25, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        display: flex;
        gap: 9px;
        left: 12px;
        max-width: calc(100% - 24px);
        padding: 7px 10px 7px 7px;
        position: absolute;
        top: 12px;
        z-index: 1;
      }

      .page-number {
        align-items: center;
        background: #b7e628;
        border-radius: 4px;
        color: #07101a;
        display: inline-flex;
        font-size: 12px;
        font-weight: 800;
        justify-content: center;
        min-height: 27px;
        min-width: 38px;
        padding: 0 6px;
      }

      .page-name {
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.35;
      }

      figcaption {
        color: #c2c7d6;
        font-size: 13px;
        line-height: 1.55;
        padding: 13px 14px 15px;
      }

      @media (max-width: 640px) {
        body {
          padding: 20px 14px;
        }

        h1 {
          font-size: 24px;
        }

        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Soundlog 디자인 피드백 검수</h1>
      <p>iPhone 16 Pro · iOS 18.0 · 이미지의 번호 배지와 페이지명으로 검수 대상을 구분합니다.</p>
    </header>

    <main>
      <figure>
        <a href="01-map-travel-mode.png">
          <span class="page-label"><span class="page-number">01</span><span class="page-name">지도 / 여행모드</span></span>
          <img src="01-map-travel-mode.png" alt="지도와 여행모드 화면" />
        </a>
        <figcaption>상단 패널 패딩, 필터 버튼과 하단 내비게이션 투명도</figcaption>
      </figure>

      <figure>
        <a href="05-log-tabs.png">
          <span class="page-label"><span class="page-number">05</span><span class="page-name">로그</span></span>
          <img src="05-log-tabs.png" alt="다른사람 보기와 내것만 보기 로그 탭" />
        </a>
        <figcaption>다른사람 보기 / 내것만 보기 2개 탭과 공개 로그 목록</figcaption>
      </figure>

      <figure>
        <a href="09-library-saved-swipe-delete.png">
          <span class="page-label"><span class="page-number">09</span><span class="page-name">보관함 - 저장곡</span></span>
          <img src="09-library-saved-swipe-delete.png" alt="저장곡 스와이프 삭제 화면" />
        </a>
        <figcaption>행을 왼쪽으로 밀었을 때 나타나는 빨간 삭제 동작</figcaption>
      </figure>

      <figure>
        <a href="11-playlist-detail-transparent-sheet.png">
          <span class="page-label"><span class="page-number">11</span><span class="page-name">플레이리스트 상세</span></span>
          <img src="11-playlist-detail-transparent-sheet.png" alt="투명한 바텀시트가 적용된 플레이리스트 상세" />
        </a>
        <figcaption>단일 배경 이미지와 뒤 배경이 이어져 보이는 투명 바텀시트</figcaption>
      </figure>

      <figure>
        <a href="15-terms-white-content.png">
          <span class="page-label"><span class="page-number">15</span><span class="page-name">서비스 이용약관</span></span>
          <img src="15-terms-white-content.png" alt="흰색 본문이 적용된 서비스 이용약관" />
        </a>
        <figcaption>제목과 본문을 어두운 배경에서 읽기 쉬운 흰색 계열로 표시</figcaption>
      </figure>

      <figure>
        <a href="16-1-onboarding-location.png">
          <span class="page-label"><span class="page-number">16-1</span><span class="page-name">온보딩 - 장소 추천</span></span>
          <img src="16-1-onboarding-location.png" alt="장소 기반 음악 추천 온보딩" />
        </a>
        <figcaption>장소와 취향을 활용한 음악 추천 소개</figcaption>
      </figure>

      <figure>
        <a href="16-2-onboarding-recap.png">
          <span class="page-label"><span class="page-number">16-2</span><span class="page-name">온보딩 - 리캡 기록</span></span>
          <img src="16-2-onboarding-recap.png" alt="리캡 기록 온보딩" />
        </a>
        <figcaption>사진, 장소, 음악을 리캡으로 기록하는 흐름 소개</figcaption>
      </figure>

      <figure>
        <a href="16-3-onboarding-travel-log.png">
          <span class="page-label"><span class="page-number">16-3</span><span class="page-name">온보딩 - 여행 로그</span></span>
          <img src="16-3-onboarding-travel-log.png" alt="여행 로그 온보딩" />
        </a>
        <figcaption>여행 중 리캡을 이동 경로와 함께 모으는 흐름 소개</figcaption>
      </figure>

      <figure>
        <a href="17-login.png">
          <span class="page-label"><span class="page-number">17</span><span class="page-name">로그인</span></span>
          <img src="17-login.png" alt="이메일과 비밀번호 로그인 화면" />
        </a>
        <figcaption>일반적인 이메일 / 비밀번호 로그인 흐름</figcaption>
      </figure>

      <figure>
        <a href="18-register.png">
          <span class="page-label"><span class="page-number">18</span><span class="page-name">회원가입</span></span>
          <img src="18-register.png" alt="회원가입 화면" />
        </a>
        <figcaption>이름, 이메일, 비밀번호와 필수 약관 동의</figcaption>
      </figure>

      <figure>
        <a href="19-auth-callback.png">
          <span class="page-label"><span class="page-number">19</span><span class="page-name">로그인 콜백 안내</span></span>
          <img src="19-auth-callback.png" alt="로그인 콜백 오류 안내 화면" />
        </a>
        <figcaption>만료되거나 잘못된 로그인 정보에 대한 복구 안내</figcaption>
      </figure>
    </main>
  </body>
</html>
